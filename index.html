<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body>
    <header>
    <div class="container">
      <a  href="index.html" class="logo">Dudeshape</a>
      <nav>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">Products</a></li>
            <li><a href="">About Us</a></li>
            <li><a href="">Contact Us</a></li>
        </ul>
      </nav>
    <ul class="external-links">
      <li>
        <a href="#" aria-label="Profile">
          <svg aria-hidden="true">
            <use href="./images/sprite.svg#icon-user"></use>
          </svg>
        </a>
      </li>
      <li>
        <a href="#">
          <svg>
            <use href="./images/sprite.svg#icon-cart"></use>

      <li>
        <a href="#">
          <svg>
            <use href="./images/sprite.svg#icon-list"></use>

    </ul>
    </div>

    <main>
        <section class="hero">

                <h1>Get Your Best Cosmetic Products Here</h1>
                <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy</p>
                <form >
                    <input type="text" placeholder="Search...">
                    <button type="submit">
                        <svg>
                            <use href="./images/sprite.svg#icon-search"></use>
                        </svg>
                    </button>
                </form>
                <a href="./index.html" class="shop-button">Shop Now</a>
                <ul class="hero-arrows">
                  <li><button><svg><use href="./images/sprite.svg#icon-left"></use></svg></button></li>
                  <li><button><svg><use href="./images/sprite.svg#icon-right"></use></svg></button></li>
